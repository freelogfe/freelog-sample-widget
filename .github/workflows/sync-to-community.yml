
name: Sync Widget to Community

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # 只允许 freelogfe 源仓库执行同步
    if: github.repository == 'freelogfe/freelog-sample-widget'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to community
        env:
          SYNC_TOKEN: ${{ secrets.COMMUNITY_SYNC_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git push \
            "https://x-access-token:${SYNC_TOKEN}@github.com/freelog-community/freelog-sample-widget.git" \
            "HEAD:refs/heads/${BRANCH_NAME}"
